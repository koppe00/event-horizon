// 3x3 matrices (rij-major arrays van 9)
const M3 = {

    for (let st = 0; st < n; st += size) for (let k = 0; k < half; k++) {
      const wr = cs[k * step], wi = sn[k * step], a = st + k, b = a + half;

// ---------- SPRAAKDETECTIE (Silero via onnxruntime-web, als beschikbaar) ----------
class VoiceDetector {
  constructor() { this.backend = "heuristic"; this.prob = 0; this.buf = []; this.res = []; this.busy = false; }

    this.rate = rate;

      if (!window.ort) await loadScript("https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js");
      ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

    } catch (e) { console.warn("Silero niet beschikbaar:", e); this.backend = "heuristic"; }
  }
  push(samples) {            // samples: Float32Array (-1..1) op this.rate
    if (this.backend !== "silero") return;
    const f = this.rate / 16000;
    for (let i = 0; i < samples.length; i++) this.res.push(samples[i]);
    if (Number.isInteger(f)) {
      const n = Math.floor(this.res.length / f) * f;
      for (let i = 0; i < n; i += f) { let s = 0; for (let k = 0; k < f; k++) s += this.res[i + k]; this.buf.push(s / f); }

  }

    if (this.busy) return;
    this.busy = true;
    try {
      while (this.buf.length >= 512) {

class HeadTracker {

      const fs = await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      this.det = await v.FaceDetector.createFromOptions(fs, { baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",

        const r = this.det.detectForVideo(this.video, now);
        if (r.detections && r.detections.length) {
          const b = r.detections.reduce((m, d) => d.boundingBox.width * d.boundingBox.height > m.boundingBox.width * m.boundingBox.height ? d : m).boundingBox;
          const cx = (b.originX + b.width / 2) / this.video.videoWidth, cy = (b.originY + b.height / 2) / this.video.videoHeight;
          let hx = -(cx - 0.5) * 2; if (T.webcam_mirror) hx = -hx;
          this.hx = lerp(this.hx, hx, 0.5); this.hy = lerp(this.hy, (cy - 0.5) * 2, 0.5);

const $ = id => document.getElementById(id);

function note(text, sec = 4) { const n = $("note"); n.textContent = text; n.style.opacity = 1; clearTimeout(ui.note); ui.note = setTimeout(() => n.style.opacity = 0, sec * 1000); }

const WORKLET = `class Cap extends AudioWorkletProcessor { constructor(){ super(); this.b = new Float32Array(1536); this.n = 0; }
  process(inp){ const c = inp[0] && inp[0][0]; if (c) { for (let i = 0; i < c.length; i++) { this.b[this.n++] = c[i]; if (this.n === 1536) { this.port.postMessage(this.b.slice(0)); this.n = 0; } } } return true; } }

function ensureCtx() {          // binnen een tik aanroepen: browsers starten audio alleen na interactie

async function start(kind, file) {

    if (kind === "mic" && !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) throw new Error("geen microfoontoegang in deze omgeving");
    await setupAudio(kind, file);
  } catch (e) {
    const framed = window.self !== window.top;
    $("msg").textContent = kind === "mic"
      ? (framed ? "In deze ingesloten weergave blokkeert de browser microfoon en camera zonder te vragen. Kies hieronder een muziekbestand, of open de webversie op je eigen adres voor microfoon en camera."

      : "Bestand kon niet worden afgespeeld.";

  try { await document.documentElement.requestFullscreen(); } catch (e) {}

  let M = Morbit;
  if (focus > 0.001) {
    let Meye = M3.mul(M3.rz(Math.sin(W.rot * 0.37) * 0.06), M3.mul(M3.rx(-Math.PI / 2 + 0.22 + Math.sin(W.rot * 0.23) * 0.06), M3.ry(W.rot * 0.25)));
    const cz = 700 - 110 * P.approach;
    Meye = M3.mul(rotFromTo([0, 0, -1], [W.eyeX - (cx - w / 2) * cz / scene.F0, W.eyeY - (cy - h / 2) * cz / scene.F0, -cz]), Meye);
    M = quatToMat(slerp(matToQuat(Morbit), matToQuat(Meye), focus));
  }
  M = M3.mul(Rg, M);

  const gb = 1.2 * Math.tanh(bass / 1.2);
  const FOV = scene.F0 * (450 + gb * 140 - mid * 30 + B * 70) / 450;
  const CORE_Z = lerp(700 - 110 * P.approach, 470, emerge);
  const Xc = (cx - w / 2) * CORE_Z / scene.F0, Yc = (cy - h / 2) * CORE_Z / scene.F0;
  const breath = Math.sin(W.breath) * P.breath_amp, pulse = an.voiceEnv * 28 * P.pulse;
  const horizon = (scene.BASE + gb * 60 + breath * 0.4 + B * 14) * S;
  const base_r = horizon + (P.gap + gb * 70 + pulse + breath * 0.6 + B * 48) * S;

  if (!window.__NORENDER) scene.render({ P, step, S, M, FOV, CORE_Z, Xc, Yc, bass, mid, high, hue, horizon, base_r, pulse, glitch: mood.glitch, time: W.tc, beat: B, hat: Hh, eye: [W.eyeX, W.eyeY], brightMul: gBright });

  if (ui.autoQ && scene.hq) { ui.slow = W.fps < 45 ? ui.slow + dt : 0; if (ui.slow > 4) { scene.hq = false; note("lichte modus aangezet (lage framerate)", 4); updatePanel(); } }
  if (an.calibrating) $("note").style.opacity = 1;
  if (ui.hud && (Math.floor(now / 100) % 2 === 0)) drawHud();
}

function drawHud() {
  const L = mood.life, top = mood.weights.map((w, i) => [w, i]).sort((a, b) => b[0] - a[0]).filter(x => x[0] > 0.03).slice(0, 3)
    .map(([w, i]) => LABELS[i][1].split(" /")[0] + " " + Math.round(w * 100) + "%").join("  ");
  const tr = tracker ? `webcam ${tracker.status}  hoofd ${tracker.hx.toFixed(2)} ${tracker.hy.toFixed(2)}  zeker ${tracker.conf.toFixed(2)}` : "webcam uit";
  $("hud").textContent =
`STATE  ${LABELS[mood.state].join(" / ")}${mood.forced !== null ? "   [GEFORCEERD]" : ""}
kandidaat ${LABELS[mood.cand][1]} (${mood.candTime.toFixed(1)}s)   in state ${mood.inState.toFixed(1)}s
stemming energie ${mood.eff[0].toFixed(2)} warmte ${mood.eff[1].toFixed(2)}   mix: ${top}
moeheid ${L.fatigue.toFixed(2)}  gewenning ${L.habituation.toFixed(2)}  schrik ${L.surprise.toFixed(2)}
activiteit ${an.activityDb.toFixed(1)} dB (bas ${an.excess[0].toFixed(1)} stem ${an.excess[1].toFixed(1)} hoog ${an.excess[2].toFixed(1)})
spraak ${an.voiceScore.toFixed(2)} [${vad.backend} ${vad.prob.toFixed(2)}]  intensiteit ${an.intensity.toFixed(2)}  beats/s ${an.onsetRate.toFixed(1)}
tempo ${an.bpm.toFixed(0)} BPM  zekerheid ${an.tempoConf.toFixed(2)}  tel ${"#".repeat(1 + Math.floor(an.beatPhase * 4))}  klank ${an.centroid.toFixed(2)}
uitbraak ${choreo.e.toFixed(2)} ${choreo.kind || "-"}  gebaar ${choreo.lastGesture || "-"}  toon ${an.pitch.toFixed(0)} Hz ${an.inUtt ? "praat" : ""}
${tr}${ui.parallax ? "" : " (perspectief uit)"}
${an.rate} Hz  ${W.fps.toFixed(0)} fps  ${scene.hq ? "hoge" : "lichte"} kwaliteit`;
}

// ---------- bediening ----------
function updatePanel() {
  document.querySelector('[data-act="quality"]').textContent = "Kwaliteit: " + (ui.autoQ ? "auto (" + (scene && scene.hq ? "hoog" : "licht") + ")" : (scene && scene.hq ? "hoog" : "licht"));
}
$("btnMic").onclick = () => { ensureCtx(); start("mic"); };
$("btnFile").onclick = () => { ensureCtx(); $("fileIn").click(); };
window.addEventListener("pointerdown", () => { if (actx && actx.state === "suspended") actx.resume().catch(() => {}); });
$("fileIn").onchange = e => { const f = e.target.files[0]; if (f) start("file", f); };
$("gear").onclick = () => { const p = $("panel"); p.style.display = p.style.display === "block" ? "none" : "block"; updatePanel(); };
$("panel").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !running) { if (b && b.dataset.act === "file") $("fileIn").click(); return; }
  const act = b.dataset.act;
  if (act === "hud") { ui.hud = !ui.hud; $("hud").style.display = ui.hud ? "block" : "none"; }
  else if (act === "frame") scene.toggleFrame();
  else if (act === "quality") { if (ui.autoQ) { ui.autoQ = false; scene.hq = !scene.hq; } else if (scene.hq) scene.hq = false; else { ui.autoQ = true; scene.hq = true; ui.slow = 0; } updatePanel(); }
  else if (act === "cal") { an.startCalibration(T.calibration_seconds); note("kamer meten… even stil", 3.2); }
  else if (act === "break") choreo.force();
  else if (act === "glitch") mood.forceGlitch = true;
  else if (act === "parallax") { ui.parallax = !ui.parallax; note("webcam-perspectief " + (ui.parallax ? "aan" : "uit")); }
  else if (act === "file") { ensureCtx(); $("fileIn").click(); }
  else if (act === "full") { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); }
  else if (act === "state") { const s = parseInt(b.dataset.s, 10); mood.forced = s < 0 ? null : s; }
});
window.addEventListener("keydown", e => {
  if (!running) return; const k = e.key.toLowerCase();
  if (k === "d") { ui.hud = !ui.hud; $("hud").style.display = ui.hud ? "block" : "none"; }
  else if (k === "f") scene.toggleFrame();
  else if (k === "q") { scene.hq = !scene.hq; ui.autoQ = false; }
  else if (k === "c") an.startCalibration(T.calibration_seconds);
  else if (k === "g") mood.forceGlitch = true;
  else if (k === "b") choreo.force();
  else if (k === "w") ui.parallax = !ui.parallax;
  else if (k === "0") mood.forced = null;
  else if (k >= "1" && k <= "6") mood.forced = parseInt(k, 10) - 1;
});
// verberg het tandwiel na een tijdje stilstand
let gearT; const showGear = () => { $("gear").style.opacity = 1; clearTimeout(gearT); gearT = setTimeout(() => { if ($("panel").style.display !== "block") $("gear").style.opacity = 0.15; }, 3000); };
window.addEventListener("pointerdown", showGear); showGear();
// in een omgeving zonder microfoon meteen het bestand voorstellen
if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !window.isSecureContext) {
  $("msg").textContent = "Microfoon is hier niet beschikbaar — kies een muziekbestand.";
} else if (window.self !== window.top) {
  $("btnMic").querySelector("small").textContent = "werkt niet in deze ingesloten weergave — gebruik je eigen adres";
}
</script>
</body>
</html>
